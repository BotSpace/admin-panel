name: Build and Push Docker on Tag

on:
  push:
    tags:
      - '*'

env:
  PROJECT_NAME: botmother-admin

permissions:
  contents: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: update env
        run: |
          update_env() {
              local env_file=".env"
              cp .env.example "$env_file"

              for kv in "$@"; do
                  local key="${kv%%=*}"
                  local value="${kv#*=}"
                  sed -i "s|^$key=.*|$key=$value|" "$env_file"
              done
          }

          update_env \
            "DEBUG=true" \
            "NEXT_PUBLIC_API=${{ vars.NEXT_PUBLIC_API }}" \
            "CONSTRUCTOR_URL=http://constructor:3000" \
            "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" \
            "NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}" \
            "SALES_URL=http://market:3000" \
            "NODE_ENV=production"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.PROJECT_NAME }}:test
          no-cache: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push to Docker Hub
        run: |
          docker tag ${{ env.PROJECT_NAME }}:test ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ steps.tag.outputs.TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ steps.tag.outputs.TAG }}
          echo "SUCCESS TAG: ${{ steps.tag.outputs.TAG }}"
